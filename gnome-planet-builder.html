<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gnome Planet Builder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#3b2a20; --ink-soft:#6b5646; --parch:#fbf6e9; --parch-2:#f3ead3; --line:#d9cba8;
    --header:#2f6468; --header-2:#3f7e82; --red:#cf3a2c; --green:#2d8a3c;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{background:#e7dec7;color:var(--ink);font-family:Nunito,system-ui,-apple-system,"Segoe UI",sans-serif;padding:16px}
  .app{max-width:1180px;margin:0 auto;background:var(--parch);border:2px solid var(--ink);border-radius:14px;overflow:hidden;box-shadow:0 6px 0 rgba(59,42,32,.18)}
  header{background:var(--header);color:#fff;padding:10px 16px}
  header h1{font-family:Fredoka,Nunito,sans-serif;font-weight:600;font-size:1.5rem;margin:0;letter-spacing:.3px}

  .stage{display:block;border-bottom:2px solid var(--ink)}
  .scene-wrap{background:#bfe3f2;touch-action:none;min-width:0}
  #scene{display:block;width:100%;height:auto;user-select:none;-webkit-user-select:none}
  .grab{cursor:grab}
  .grab.dragging{cursor:grabbing}
  .sw-btn{cursor:pointer}
  .sw-btn:focus{outline:none}
  .sw-btn:focus-visible rect{stroke-width:3.5}

  .panel h2{font-family:Fredoka,Nunito,sans-serif;font-weight:600;font-size:1.05rem;margin:0 0 8px}

  .panel{padding:14px 16px 10px}
  .builder{display:grid;grid-template-columns:190px 1fr;gap:10px 22px;align-items:center;border-bottom:2px solid var(--line)}
  .globe-box{text-align:center}
  #globe{width:180px;height:180px;display:block;margin:0 auto}
  .globe-note{font-size:.8rem;color:var(--ink-soft);font-weight:600}
  .bgrid{display:grid;grid-template-columns:70px minmax(160px,1fr) auto;align-items:center;gap:12px 14px;margin:8px 0}
  .brow{display:contents}
  .blabel{font-family:Fredoka,Nunito,sans-serif;font-weight:600;font-size:1.2rem;width:70px}
  .brow .slider{width:100%;accent-color:var(--header)}
  .bnum{display:flex;align-items:center;white-space:nowrap;font-weight:700;font-size:1.05rem;font-variant-numeric:tabular-nums}
  .num{width:84px;font:inherit;font-weight:700;text-align:right;padding:4px 6px;border:2px solid var(--line);border-radius:6px;background:#fff;color:var(--ink)}
  .num:focus{outline:none;border-color:var(--ink)}
  .zeros{color:var(--ink-soft);margin-left:2px}
  .unit{margin-left:6px}
  .density{font-weight:600;margin:12px 0 4px;font-size:1.05rem}
  .density b{font-size:1.2rem;font-variant-numeric:tabular-nums}
  .density .aside{color:var(--ink-soft);font-weight:600;font-size:.9rem}
  .presets{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:10px}
  .preset{font:inherit;font-weight:700;font-size:.92rem;border:2px solid var(--line);background:#fff;color:var(--ink);border-radius:999px;padding:4px 11px 4px 7px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
  .preset:hover{border-color:var(--ink-soft)}
  .preset[aria-pressed="true"]{border-color:var(--ink);background:#fff8e6}
  .preset .dot{width:12px;height:12px;border-radius:50%;border:1.5px solid var(--ink)}
  .actions{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;margin-top:14px}
  .actions .grp{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .btn{font:inherit;font-weight:700;border:2px solid var(--ink);background:#fff;color:var(--ink);border-radius:8px;padding:7px 14px;cursor:pointer}
  .btn:hover:not(:disabled){background:#fff8e6}
  .btn:disabled{opacity:.45;cursor:default}
  .btn.drop{background:var(--header);color:#fff;font-size:1.1rem;padding:8px 22px}
  .btn.drop:hover:not(:disabled){background:var(--header-2)}
  .seg{display:inline-flex;border:2px solid var(--ink);border-radius:8px;overflow:hidden}
  .seg button{font:inherit;font-weight:700;border:none;background:#fff;color:var(--ink);padding:6px 11px;cursor:pointer;border-left:2px solid var(--ink)}
  .seg button:first-child{border-left:none}
  .seg button[aria-pressed="true"]{background:var(--ink);color:#fff}
  .lbl{color:var(--ink-soft);font-weight:600}

  .bar{border-top:2px solid var(--ink);background:var(--parch-2);padding:10px 16px 12px;display:flex;align-items:center;justify-content:space-between;gap:10px 18px;flex-wrap:wrap}
  .group{display:flex;align-items:center;gap:8px 14px;flex-wrap:wrap;font-weight:600}
  .group label{display:flex;align-items:center;gap:6px;cursor:pointer}
  footer{font-size:.8rem;color:var(--ink-soft);text-align:center;padding:8px 12px 12px}

  @media (max-width:820px){
    .builder{grid-template-columns:1fr}
    .zeros{font-size:.74rem}
    .bgrid{grid-template-columns:64px 1fr}
    .bnum{grid-column:1 / -1;margin:-6px 0 4px 0}
  }
</style>
</head>
<body>
<div class="app">
  <header><h1>Gnome Planet Builder</h1></header>

  <div class="stage">
  <div class="scene-wrap">
    <svg id="scene" viewBox="0 0 1000 640" aria-label="Gnomes on a cliff 80 meters tall, ready to drop something">

        <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">

        </linearGradient>
        <linearGradient id="meadow" x1="0" y1="0" x2="0" y2="1">
          <stop id="groundTop" offset="0" stop-color="#a7cf72"/><stop id="groundBot" offset="1" stop-color="#8dbb5c"/>
        </linearGradient>

        <!-- things to drop: each drawn sitting on y = 0 -->
        <symbol id="obj-duck" viewBox="-40 -80 80 80">

            <circle cx="14" cy="-31" r="2.2" fill="#3b2a20" stroke="none"/>
            <path d="M-10 -12 q9 -9 18 0" fill="none"/>
            <path d="M-24 -14 l-5 -5" fill="none" stroke-linecap="round"/>
          </g>
        </symbol>
        <symbol id="obj-teapot" viewBox="-40 -80 80 80">
          <g stroke="#3b2a20" stroke-width="2" stroke-linejoin="round">
            <path d="M-21 -31 C-35 -31 -35 -13 -21 -13" fill="none" stroke-width="3.5"/>
            <path d="M15 -20 C25 -20 28 -33 33 -40 L37 -37 C32 -29 30 -14 17 -11 Z" fill="#f4efe4"/>
            <path d="M-17 0 H17 L21 -8 H-21 Z" fill="#e3d4bd"/>
            <path d="M-22 -8 C-29 -21 -23 -38 0 -38 C23 -38 29 -21 22 -8 Z" fill="#f4efe4"/>
            <path d="M-26 -23 H26" stroke="#5b8fd0" stroke-width="3"/>
            <path d="M-13 -38 C-11 -46 11 -46 13 -38 Z" fill="#e3d4bd"/>
            <circle cx="0" cy="-48" r="3.5" fill="#5b8fd0"/>
            <circle cx="-9" cy="-30" r="2.5" fill="#d96a8a" stroke="none"/><circle cx="9" cy="-15" r="2.5" fill="#d96a8a" stroke="none"/>
          </g>
        </symbol>
        <symbol id="obj-bowling" viewBox="-40 -80 80 80">
          <g stroke="#3b2a20" stroke-width="2">
            <circle cx="0" cy="-22" r="22" fill="#2f4f9a"/>
            <circle cx="-6" cy="-33" r="3" fill="#152040"/><circle cx="3" cy="-35" r="3" fill="#152040"/><circle cx="-1" cy="-25" r="3.6" fill="#152040"/>
            <path d="M-15 -31 q4 -7 11 -9" stroke="#a9bdeb" stroke-width="3" fill="none" stroke-linecap="round"/>
          </g>
        </symbol>
        <symbol id="obj-pumpkin" viewBox="-40 -80 80 80">
          <g stroke="#3b2a20" stroke-width="2" stroke-linejoin="round">
            <ellipse cx="-15" cy="-22" rx="17" ry="21" fill="#e0782a"/>
            <ellipse cx="15" cy="-22" rx="17" ry="21" fill="#e0782a"/>
            <ellipse cx="0" cy="-23" rx="15" ry="23" fill="#f39a3d"/>
            <path d="M-3 -45 C-3 -53 2 -58 8 -58 L9 -53 C4 -52 3 -49 3 -45 Z" fill="#6d8a3a"/>
            <path d="M3 -50 C10 -54 16 -50 14 -44" fill="none" stroke="#6d8a3a" stroke-width="2"/>
          </g>
        </symbol>
        <symbol id="obj-anvil" viewBox="-40 -80 80 80">
          <g stroke="#3b2a20" stroke-width="2" stroke-linejoin="round">
            <path d="M-38 -38 C-24 -43 -14 -42 -10 -42 H36 V-31 C30 -29 22 -27 18 -23 L16 -12 H22 V0 H-18 V-12 H-12 L-14 -23 C-18 -29 -27 -33 -38 -38 Z" fill="#4f565e"/>
            <path d="M-8 -39 H33" stroke="#9aa3ac" stroke-width="2"/>
            <path d="M-12 -6 H16" stroke="#6f7780" stroke-width="2"/>
          </g>
        </symbol>
        <symbol id="obj-piano" viewBox="-40 -80 80 80">
          <g stroke="#3b2a20" stroke-width="2" stroke-linejoin="round">
            <rect x="-33" y="-70" width="66" height="62" rx="3" fill="#7a4a2e"/>
            <rect x="-36" y="-75" width="72" height="7" rx="2" fill="#5f3822"/>
            <rect x="-26" y="-64" width="52" height="20" rx="3" fill="none" stroke="#c79a5b" stroke-width="1.5"/>
            <rect x="-9" y="-61" width="18" height="14" fill="#f4ecd8" stroke-width="1.5"/>
            <path d="M-6 -57 h12 M-6 -54 h12 M-6 -51 h12" stroke="#6b5646" stroke-width="1"/>
            <rect x="-37" y="-38" width="74" height="9" rx="1.5" fill="#5f3822"/>
            <rect x="-33" y="-42" width="66" height="6" fill="#fffaf0" stroke-width="1.5"/>
            <g fill="#3b2a20" stroke="none">
              <rect x="-27" y="-42" width="3" height="3.5"/><rect x="-21" y="-42" width="3" height="3.5"/><rect x="-12" y="-42" width="3" height="3.5"/>

              <rect x="15" y="-42" width="3" height="3.5"/><rect x="24" y="-42" width="3" height="3.5"/>
            </g>

      <path id="cliffTop" d="M0 120 H372 L374 130 C300 134 120 132 0 130 Z" fill="#7fb35a" stroke="#3b2a20" stroke-width="2"/>

      <!-- drop platform with a trapdoor -->
      <g stroke="#3b2a20" stroke-width="2.5" stroke-linejoin="round">
        <path d="M372 170 L398 130" stroke-width="5" stroke="#6b4a2e"/>
        <path d="M372 170 L398 130" stroke-width="1.5" stroke="#3b2a20" fill="none"/>

        <circle cx="396" cy="125" r="3" fill="#3b2a20"/>
      </g>

      <!-- vertical ruler: meters fallen -->
      <g id="vruler"></g>

    paused = false; rate = 1;
    $$('.seg button').forEach(x => x.setAttribute('aria-pressed', x.dataset.rate === '1'));
    $('#gravChk').checked = false; $('#forceChk').checked = false;
    $('#swChk').checked = $('#tapeChk').checked = $('#speedoChk').checked = $('#linkChk').checked = true;
    $('#soundChk').checked = true; sound = true;
    swReset(); Object.assign(SW, SW_HOME); Object.assign(SP, SP_HOME); Object.assign(TP, TAPE_HOME);
    placeStopwatch(); placeSpeedo(); renderTape(); setToolVisibility();
    setBody(PLANETS[0].mass, PLANETS[0].radius);
  });

  // ---------- rendering ----------
  function renderObject(now) {
    const yb = Y0 + fallen() * PPM;   // the object's bottom
    let sx = 1, sy = 1;
    if (landedAt > 0) { const k = (now - landedAt) / 280; if (k < 1) { const s = 0.16 * Math.sin(Math.PI * k); sy = 1 - s; sx = 1 + s; } }
    $('#objGroup').setAttribute('transform', `translate(${DROP_X},${yb.toFixed(2)}) scale(${sx},${sy}) translate(${-DROP_X},${-yb.toFixed(2)})`);
    const u = $('#objUse'); u.setAttribute('x', DROP_X - 40); u.setAttribute('y', (yb - 80).toFixed(2));
    const gl = $('#guide'); gl.setAttribute('y1', yb.toFixed(2)); gl.setAttribute('y2', yb.toFixed(2));
    // trapdoor swings open after the drop
    const open = doorAt > 0 ? clampV((now - doorAt) / 180, 0, 1) : 0;
    $('#trapdoor').setAttribute('transform', `rotate(${(80 * open).toFixed(1)} 396 125)`);
    // dust when it lands
    const dust = $('#dust');
    if (landedAt > 0 && now - landedAt < 900) {
      const k = (now - landedAt) / 900;
      if (!dust.childElementCount) for (const dx of [-30, -14, 14, 30]) { const e = document.createElementNS(NS, 'ellipse'); e.dataset.dx = dx; dust.appendChild(e); }
      dust.setAttribute('opacity', (0.9 * (1 - k)).toFixed(2));
      for (const e of dust.children) {
        const dx = +e.dataset.dx;
        e.setAttribute('cx', DROP_X + dx * (1 + 1.4 * k)); e.setAttribute('cy', GROUND - 6 - 10 * k);
        e.setAttribute('rx', 7 + 8 * k); e.setAttribute('ry', 5 + 5 * k);
      }
    } else dust.setAttribute('opacity', 0);
  }
  function renderRulerTitle() {
    const t = $('#rulerTitle'), w = t.getComputedTextLength() + 12, r = $('#rulerTitleBox');
    r.setAttribute('x', 522 - w / 2); r.setAttribute('y', Y0 - 30); r.setAttribute('width', w); r.setAttribute('height', 20);
  }

  // ---------- loop ----------
  let last = performance.now();
  function frame(now) {
    let el = (now - last) / 1000; last = now; if (el > 0.25) el = 0.25;
    if (!paused) advance(el * rate);
    renderObject(now); renderStopwatch(); renderSpeedo();
    requestAnimationFrame(frame);
  }
  setBody(P.mass, P.radius);
  placeStopwatch(); placeSpeedo(); renderTape(); setToolVisibility(); renderRulerTitle(); syncButtons();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { renderTape(); renderRulerTitle(); });
  requestAnimationFrame(frame);
})();
</script>
</body>
