<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Moving Gnomes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#3b2a20; --ink-soft:#6b5646; --parch:#fbf6e9; --parch-2:#f3ead3; --line:#d9cba8;
    --header:#2f6468; --header-2:#3f7e82;
    --pos:#2457c5; --vel:#cf3a2c; --acc:#2d8a3c;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{background:#e7dec7;color:var(--ink);font-family:Nunito,system-ui,-apple-system,"Segoe UI",sans-serif;padding:16px}
  .app{max-width:1100px;margin:0 auto;background:var(--parch);border:2px solid var(--ink);border-radius:14px;overflow:hidden;box-shadow:0 6px 0 rgba(59,42,32,.18)}
  header{background:var(--header);color:#fff;display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding:10px 16px 0;flex-wrap:wrap}
  header h1{font-family:Fredoka,Nunito,sans-serif;font-weight:600;font-size:1.5rem;margin:0 0 10px;letter-spacing:.3px}
  .tabs{display:flex;gap:4px}
  .tab{font:inherit;font-weight:700;border:2px solid var(--ink);border-bottom:none;border-radius:10px 10px 0 0;padding:7px 18px;background:var(--header-2);color:#e8f3f2;cursor:pointer}
  .tab[aria-selected="true"]{background:var(--parch);color:var(--ink)}
  .scene-wrap{border-bottom:2px solid var(--ink);background:#bfe3f2;touch-action:none}
  #scene{display:block;width:100%;height:auto;user-select:none;-webkit-user-select:none}
  #gnome{cursor:grab}
  #gnome.dragging{cursor:grabbing}
  .wallx{cursor:pointer}

  /* Introduction controls */
  .intro-controls{padding:18px 16px 10px;display:grid;grid-template-columns:auto minmax(160px,420px) auto auto;gap:10px 16px;align-items:center;justify-content:center}
  .qlabel{font-family:Fredoka,Nunito,sans-serif;font-weight:600;font-size:1.35rem;padding:2px 10px;border-radius:8px;border:2px solid transparent}
  .qlabel.x{color:var(--pos)} .qlabel.v{color:var(--vel)} .qlabel.a{color:var(--acc)}
  .row-active .qlabel, .qlabel.active{border-color:currentColor;background:#fff}
  .numwrap{display:flex;align-items:center;gap:6px;white-space:nowrap}
  .num{width:84px;font:inherit;font-weight:700;font-size:1.05rem;text-align:right;padding:4px 6px;border:2px solid var(--line);border-radius:6px;background:#fff;color:var(--ink);font-variant-numeric:tabular-nums}
  .num:focus{outline:none;border-color:var(--ink)}
  .unit{font-weight:700;font-size:1.1rem}
  .unit.x{color:var(--pos)} .unit.v{color:var(--vel)} .unit.a{color:var(--acc)}
  .vec{display:flex;align-items:center;gap:6px;font-size:.95rem;color:var(--ink-soft);white-space:nowrap}
  .vec input{width:17px;height:17px}

  input[type=range].slider{width:100%;accent-color:var(--ink)}
  input[type=range].slider.x{accent-color:var(--pos)}
  input[type=range].slider.v{accent-color:var(--vel)}
  input[type=range].slider.a{accent-color:var(--acc)}

  /* Charts */
  .charts{padding:10px 16px 6px;display:none}
  .charts.on{display:block}
  .chart-row{display:grid;grid-template-columns:190px 1fr;gap:12px;align-items:center;margin:6px 0}
  .chart-ctrl{display:flex;flex-direction:column;gap:6px;padding:8px 10px;border:2px solid var(--line);border-radius:10px;background:#fff}
  .chart-ctrl.row-active{border-color:var(--ink)}
  .chart-ctrl .qlabel{font-size:1.15rem;padding:0;border:none;background:none}
  .chart{width:100%;height:130px;display:block;background:#fff;border:2px solid var(--line);border-radius:10px}
  .intro-controls.off{display:none !important}

  /* Playback bar */
  .playbar{border-top:2px solid var(--ink);background:var(--parch-2);padding:10px 16px 12px}
  .timeline{width:100%;margin:0 0 10px;height:14px;-webkit-appearance:none;appearance:none;border-radius:8px;border:2px solid var(--ink);
    background:linear-gradient(90deg,#e5b54a 0 var(--rec,0%),#fff var(--rec,0%) 100%)}
  .timeline::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:24px;border-radius:4px;background:var(--ink);cursor:pointer}
  .timeline::-moz-range-thumb{width:12px;height:24px;border-radius:4px;background:var(--ink);cursor:pointer;border:none}
  .pb-row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
  .group{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .btn{font:inherit;font-weight:700;border:2px solid var(--ink);background:#fff;color:var(--ink);border-radius:8px;padding:6px 12px;cursor:pointer}
  .btn:hover{background:#fff8e6}
  .round{width:42px;height:42px;border-radius:50%;padding:0;display:grid;place-items:center}
  .round.big{width:56px;height:56px;background:var(--header);color:#fff}
  .round.big:hover{background:var(--header-2)}
  .round svg{display:block}
  .radios{display:flex;flex-direction:column;gap:2px;font-weight:600}
  .radios label,.checks label{display:flex;align-items:center;gap:6px;cursor:pointer}
  .checks{display:flex;gap:14px;font-weight:600}
  .status{font-size:.9rem;color:var(--vel);min-height:1.2em;margin-top:6px;text-align:center}
  footer{font-size:.8rem;color:var(--ink-soft);text-align:center;padding:8px 12px 12px}

  @media (max-width:720px){
    .intro-controls{grid-template-columns:1fr auto;grid-auto-flow:row dense;gap:6px 10px}
    .intro-controls .qlabel{grid-column:1;justify-self:start;margin-top:8px}
    .intro-controls .numwrap{grid-column:2;margin-top:8px}
    .intro-controls .slider,.intro-controls .vec{grid-column:1 / -1}
    .intro-controls .vec.empty{display:none}
    .chart-row{grid-template-columns:1fr}
    .chart{height:110px}
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>The Moving Gnomes</h1>
  </header>

  <div class="scene-wrap">
    <svg id="scene" viewBox="0 0 1000 330" aria-label="Gnomes standing on a number line from minus 10 to 10 meters">

        <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#a9d8ee"/><stop offset="1" stop-color="#dff1f4"/>
        </linearGradient>
        <linearGradient id="meadow" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#a7cf72"/><stop offset="1" stop-color="#8dbb5c"/>
        </linearGradient>
        <pattern id="stones" width="34" height="22" patternUnits="userSpaceOnUse">
          <rect width="34" height="22" fill="#b9ab95"/>
          <path d="M0 11H34M17 0V11M0 22M8 11V22M25 11V22" stroke="#7d6c58" stroke-width="2" fill="none"/>
        </pattern>
      </defs>

      <rect x="0" y="0" width="1000" height="250" fill="url(#sky)"/>

      </g>

        <path d="M-30 -130 q8 -10 18 -4 M14 -150 q10 -8 20 0 M20 -112 q8 -8 16 -2" fill="none" stroke="#3f7a2e" stroke-width="2.5"/>
      </g>

      <!-- cottage at +8 m -->
      <g transform="translate(804,250)" stroke="#3b2a20" stroke-width="3" stroke-linejoin="round">
        <rect x="-48" y="-78" width="96" height="78" fill="#f2e4c4"/>
        <path d="M-66 -70 Q0 -150 66 -70 Z" fill="#c9553b"/>
        <path d="M-40 -96 q10 -6 20 0 M-6 -112 q10 -6 20 0 M20 -92 q8 -5 16 0" fill="none" stroke="#8f3424" stroke-width="2.5"/>
        <path d="M-14 0 V-36 a14 14 0 0 1 28 0 V0 Z" fill="#8a5a33"/>
        <circle cx="8" cy="-18" r="2.4" fill="#3b2a20" stroke="none"/>
        <circle cx="-31" cy="-46" r="11" fill="#f7d77a"/>
        <path d="M-31 -57 V-35 M-42 -46 H-20" fill="none" stroke-width="2.5"/>
        <circle cx="31" cy="-46" r="11" fill="#f7d77a"/>
        <path d="M31 -57 V-35 M20 -46 H42" fill="none" stroke-width="2.5"/>
      </g>

      <!-- walls -->
      <g id="wallL">
        <rect x="8" y="120" width="56" height="130" fill="url(#stones)" stroke="#3b2a20" stroke-width="3"/>
        <g class="wallx" data-side="L" transform="translate(26,138)">
          <circle r="13" fill="#d9483b" stroke="#3b2a20" stroke-width="2.5"/>
          <path d="M-5 -5 L5 5 M5 -5 L-5 5" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
          <title>Remove this wall</title>
        </g>
      </g>
      <g id="wallR">
        <rect x="936" y="120" width="56" height="130" fill="url(#stones)" stroke="#3b2a20" stroke-width="3"/>
        <g class="wallx" data-side="R" transform="translate(974,138)">
          <circle r="13" fill="#d9483b" stroke="#3b2a20" stroke-width="2.5"/>
          <path d="M-5 -5 L5 5 M5 -5 L-5 5" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
          <title>Remove this wall</title>
        </g>
      </g>

      <!-- ruler -->
      <g id="ruler"></g>

  <!-- controls -->
  <section class="intro-controls" id="introControls">
    <span class="qlabel x" data-row="x">Position</span>
    <input class="slider x" data-k="x" type="range" min="-10" max="10" step="0.01" value="0" aria-label="Position">
    <span class="numwrap"><input class="num" data-k="x" inputmode="decimal" value="0.00" aria-label="Position in meters"><span class="unit x">m</span></span>
    <span class="vec empty"></span>

    <span class="qlabel v" data-row="v">Velocity</span>
    <input class="slider v" data-k="v" type="range" min="-6" max="6" step="0.01" value="0" aria-label="Velocity">
    <span class="numwrap"><input class="num" data-k="v" inputmode="decimal" value="0.00" aria-label="Velocity in meters per second"><span class="unit v">m/s</span></span>
    <label class="vec"><input type="checkbox" id="showV"> Velocity vector</label>

    <span class="qlabel a" data-row="a">Acceleration</span>
    <input class="slider a" data-k="a" type="range" min="-6" max="6" step="0.01" value="0" aria-label="Acceleration">
    <span class="numwrap"><input class="num" data-k="a" inputmode="decimal" value="0.00" aria-label="Acceleration in meters per second squared"><span class="unit a">m/s²</span></span>
    <label class="vec"><input type="checkbox" id="showA"> Acceleration vector</label>
  </section>

  <section class="playbar">
    <div class="pb-row" style="justify-content:flex-end">
      <div class="group">
        <div class="checks">
          <label><input type="checkbox" id="wallsChk" checked> Walls</label>
          <label><input type="checkbox" id="soundChk" checked> Sound</label>
        </div>
        <button class="btn" id="resetBtn">Reset All</button>
      </div>
    </div>
  </section>
  <footer>Inspired by <em>The Moving Man</em> from PhET Interactive Simulations, University of Colorado Boulder. Gnome art © Sarah Allen.</footer>
</div>

<script>
(() => {
  const DT = 1/60, XMAX = 10;
  const GROUND = 250, PX0 = 500, PPM = 38;   // scene: 38 px per meter, 0 m at x=500
  const px = x => PX0 + x * PPM;
  const toWorld = p => (p - PX0) / PPM;

  const S = { x:0, v:0, a:0, mode:'x', t:0, walls:true, sound:true, showV:false, showA:false, facing:1 };
  let targetX = 0;
  let xh = [], vh = [];  // short history, used to work out velocity and acceleration while the gnomes are dragged
  let dragging = false;
  let bonkAt = -1;

  const $ = s => document.querySelector(s);
  const $$ = s => Array.from(document.querySelectorAll(s));
  const svg = $('#scene');

  // ---------- ruler ----------
  (function buildRuler(){
    const g = $('#ruler'), NS = 'http://www.w3.org/2000/svg';
    const mk = (tag, attrs, text) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (text != null) e.textContent = text; g.appendChild(e); return e; };
    mk('rect', { x: px(-10.6), y: GROUND, width: 21.2*PPM, height: 28, rx: 3, fill: '#f0dc8e', stroke: '#3b2a20', 'stroke-width': 2.5 });
    for (let m = -10; m <= 10; m++) {
      const big = m % 2 === 0;
      mk('line', { x1: px(m), x2: px(m), y1: GROUND, y2: GROUND + (big ? 10 : 6), stroke: '#3b2a20', 'stroke-width': big ? 2 : 1.5 });
      if (big) mk('text', { x: px(m), y: GROUND + 24, 'text-anchor': 'middle', 'font-family': 'Nunito, sans-serif', 'font-weight': 700, 'font-size': 14, fill: '#3b2a20' }, m === 0 ? '0 meters' : String(m));
    }
  })();

  // ---------- helpers ----------
  const fmt = n => { const r = Math.round(n * 100) / 100; return (r === 0 ? 0 : r).toFixed(2); };
  const clampX = x => S.walls ? Math.max(-XMAX, Math.min(XMAX, x)) : Math.max(-999, Math.min(999, x));
  function slope(arr, key, win) {
    if (arr.length < 2) return 0;
    const tEnd = arr[arr.length - 1].t; let n=0, st=0, sy=0, stt=0, sty=0;
    for (let i = arr.length - 1; i >= 0 && tEnd - arr[i].t <= win + 1e-9; i--) {
      const t = arr[i].t - tEnd, y = arr[i][key]; n++; st += t; sy += y; stt += t*t; sty += t*y;
    }
    const d = n*stt - st*st; return (n < 2 || d === 0) ? 0 : (n*sty - st*sy) / d;
  }
  const trim = (arr, t) => { while (arr.length && t - arr[0].t > 0.5) arr.shift(); };
  function resetHistory() { xh = [{ t: S.t, x: S.x }]; vh = [{ t: S.t, v: S.v }]; }

  // ---------- sound ----------
  let ac = null;
  function bonk() {
    bonkAt = performance.now();
    if (!S.sound) return;
    try {
      ac = ac || new (window.AudioContext || window.webkitAudioContext)();
      const t = ac.currentTime, o = ac.createOscillator(), g = ac.createGain();
      o.type = 'triangle'; o.frequency.setValueAtTime(190, t); o.frequency.exponentialRampToValueAtTime(55, t + 0.2);
      g.gain.setValueAtTime(0.45, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.28);
      o.connect(g).connect(ac.destination); o.start(t); o.stop(t + 0.3);
    } catch (e) {}
  }

  // ---------- model (always running) ----------
  function setMode(m) {
    if (m === 'x' && S.mode !== 'x') { resetHistory(); targetX = S.x; }
    S.mode = m;
  }

  function step() {
    const t = S.t + DT;
    if (S.mode === 'x') {
      S.x = clampX(targetX);
      xh.push({ t, x: S.x }); trim(xh, t);
      S.v = slope(xh, 'x', 0.25);
      vh.push({ t, v: S.v }); trim(vh, t);
      S.a = slope(vh, 'v', 0.3);
      if (Math.abs(S.v) < 0.005) S.v = 0;
      if (Math.abs(S.a) < 0.005) S.a = 0;
    } else if (S.mode === 'v') {
      S.x += S.v * DT; S.a = 0;
    } else {
      S.v += S.a * DT; S.x += S.v * DT;
    }
    if (S.walls && Math.abs(S.x) > XMAX) {
      S.x = Math.sign(S.x) * XMAX;
      if (S.mode !== 'x') { if (Math.abs(S.v) > 0.3) bonk(); S.v = 0; }
    }
    S.t = t;
  }

  // ---------- input from controls ----------
  // opts.jump: the position was typed in, so move the gnomes there without a burst of speed
  function userSet(k, val, opts = {}) {
    if (!isFinite(val)) return;
    if (k === 'x') {
      setMode('x');
      targetX = clampX(val);
      if (opts.jump) { S.x = targetX; S.v = 0; S.a = 0; resetHistory(); }
    } else if (k === 'v') {
      setMode('v'); S.v = val; S.a = 0;
    } else {
      setMode('a'); S.a = val;
    }
  }

  $$('.slider').forEach(el => {
    el.addEventListener('pointerdown', () => el._held = true);
    el.addEventListener('pointerup', () => el._held = false);
    el.addEventListener('pointercancel', () => el._held = false);
    el.addEventListener('blur', () => el._held = false);
    el.addEventListener('input', () => userSet(el.dataset.k, parseFloat(el.value)));
  });
  $$('.num').forEach(el => {
    el.addEventListener('change', () => {
      const v = parseFloat(el.value.replace(',', '.'));
      if (isFinite(v)) userSet(el.dataset.k, v, { jump: true });
      el.blur();
    });
    el.addEventListener('keydown', e => { if (e.key === 'Enter') el.blur(); if (e.key === 'Escape') { el.value = fmt(S[el.dataset.k]); el.blur(); } });
    el.addEventListener('focus', () => el.select());
  });

  // drag the gnomes
  const gnome = $('#gnome');
  function svgX(e) { const p = svg.createSVGPoint(); p.x = e.clientX; p.y = e.clientY; return p.matrixTransform(svg.getScreenCTM().inverse()).x; }
  let grabOffset = 0;
  gnome.addEventListener('pointerdown', e => {
    e.preventDefault(); dragging = true; gnome.classList.add('dragging');
    svg.setPointerCapture(e.pointerId);
    grabOffset = toWorld(svgX(e)) - S.x;
    userSet('x', S.x);
  });
  svg.addEventListener('pointermove', e => { if (dragging) userSet('x', toWorld(svgX(e)) - grabOffset); });
  const endDrag = () => { dragging = false; gnome.classList.remove('dragging'); };
  svg.addEventListener('pointerup', endDrag); svg.addEventListener('pointercancel', endDrag);

  // walls, sound, vectors, reset
  function setWalls(on) {
    S.walls = on; $('#wallsChk').checked = on;
    $('#wallL').style.display = $('#wallR').style.display = on ? '' : 'none';
    if (on && Math.abs(S.x) > XMAX) { S.x = clampX(S.x); targetX = clampX(targetX); S.v = 0; resetHistory(); }
  }
  $$('.wallx').forEach(b => b.addEventListener('click', () => setWalls(false)));
  $('#wallsChk').addEventListener('change', e => setWalls(e.target.checked));
  $('#soundChk').addEventListener('change', e => S.sound = e.target.checked);
  $('#showV').addEventListener('change', e => S.showV = e.target.checked);
  $('#showA').addEventListener('change', e => S.showA = e.target.checked);
  $('#resetBtn').addEventListener('click', () => {
    Object.assign(S, { x:0, v:0, a:0, mode:'x', showV:false, showA:false, facing:1 });
    targetX = 0; resetHistory();
    $('#showV').checked = false; $('#showA').checked = false;
    $('#soundChk').checked = true; S.sound = true; setWalls(true);
  });

  // ---------- rendering ----------
  function arrowPath(x0, y, len) {
    const h = Math.min(14, Math.abs(len) * 0.6), s = Math.sign(len), w = 4, hw = 10;
    const xe = x0 + len, xb = xe - s * h;
    return `M${x0} ${y - w} L${xb} ${y - w} L${xb} ${y - hw} L${xe} ${y} L${xb} ${y + hw} L${xb} ${y + w} L${x0} ${y + w} Z`;
  }
  function setArrow(id, on, x0, y, len) {
    const g = $(id);
    if (!on || Math.abs(len) < 3) { g.setAttribute('visibility', 'hidden'); return; }
    g.setAttribute('visibility', 'visible'); g.firstElementChild.setAttribute('d', arrowPath(x0, y, len));
  }

  function renderScene() {
    if (S.v > 0.05) S.facing = 1; else if (S.v < -0.05) S.facing = -1;
    const p = px(S.x);
    const wob = Math.sin(S.x * 2.4) * Math.min(Math.abs(S.v) / 4, 1) * 4;
    let sq = 1;
    if (bonkAt > 0) { const k = (performance.now() - bonkAt) / 260; sq = k < 1 ? 1 - 0.12 * Math.sin(Math.PI * k) : 1; }
    gnome.setAttribute('transform', `translate(${p.toFixed(2)},${GROUND}) rotate(${wob.toFixed(2)})`);
    $('#gnomeArt').setAttribute('transform', `scale(${S.facing * (2 - sq)},${sq})`);
    $('#posMarker').setAttribute('transform', `translate(${p.toFixed(2)},262)`);

    setArrow('#vArrow', S.showV, p, 52, S.v * 20);
    setArrow('#aArrow', S.showA, p, 26, S.a * 20);

    const off = $('#offsign');
    if (p < -20 || p > 1020) {
      const right = p > 1020, label = `${right ? '' : '← '}gnomes at ${fmt(S.x)} m${right ? ' →' : ''}`;
      const t = $('#offtext'); t.textContent = label;
      const w = t.getComputedTextLength() + 24;
      const bx = right ? 1000 - w - 10 : 10;
      $('#offbox').setAttribute('x', bx); $('#offbox').setAttribute('width', w);
      t.setAttribute('x', bx + 12);
      off.setAttribute('visibility', 'visible');
    } else off.setAttribute('visibility', 'hidden');
  }

  function renderControls() {
    const focused = document.activeElement;
    $$('.num').forEach(el => { if (el !== focused) el.value = fmt(S[el.dataset.k]); });
    $$('.slider').forEach(el => { if (!el._held) el.value = S[el.dataset.k]; });
    $$('[data-row]').forEach(el => el.classList.toggle('active', el.dataset.row === S.mode));
  }

  // ---------- loop ----------
  let last = performance.now(), acc = 0;
  function frame(now) {
    let el = (now - last) / 1000; last = now; if (el > 0.25) el = 0.25;
    acc += el;
    while (acc >= DT) { acc -= DT; step(); }
    renderScene(); renderControls();
    requestAnimationFrame(frame);
  }
  resetHistory();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
